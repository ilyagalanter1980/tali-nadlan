/* Layout: navy office band with big phone → featured exclusive listing → category pills + filters → wide listing rows (photo | details); detail sheet with sticky contact bar on phones */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --ink:#1a2135; --muted:#5d6579; --line:#dde1ea;
  --band:#1a2443; --band-ink:#f2f0ea; --band-muted:#aab3cc;
  --accent:#2b4d8c; --accent-ink:#ffffff; --accent-soft:#e6ecf7;
  --brass:#8a6524; --brass-on-band:#e3c27c; --sold:#9a3d33; --wa:#1a7d44;
  --art-sky:#dde3ee; --art-sun:#eed8a4; --art-ground:#c7cedb; --art-wall:#fafbfd; --art-wall2:#e4e8ef; --art-win:#a8b3c7; --art-hl:#2b4d8c; --art-tree:#6a8e77;
  --shadow:0 1px 2px rgba(26,33,53,.06),0 10px 28px rgba(26,33,53,.08);
  --f-display:"Suez One","Playfair Display",Georgia,serif;
  --f-body:"Rubik","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1320; --surface:#171d2c; --ink:#e6e9f1; --muted:#9aa2b6; --line:#283146;
  --band:#0a0e19; --band-ink:#f2f0ea; --band-muted:#8d97b1;
  --accent:#8eaeea; --accent-ink:#0d1424; --accent-soft:#1d2840;
  --brass:#d8b46c; --brass-on-band:#e3c27c; --sold:#e08b7e; --wa:#3fb874;
  --art-sky:#1d2537; --art-sun:#5b4f34; --art-ground:#242d40; --art-wall:#2c3549; --art-wall2:#232b3d; --art-win:#4a5672; --art-hl:#8eaeea; --art-tree:#3d6150;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1320; --surface:#171d2c; --ink:#e6e9f1; --muted:#9aa2b6; --line:#283146;
  --band:#0a0e19; --band-ink:#f2f0ea; --band-muted:#8d97b1;
  --accent:#8eaeea; --accent-ink:#0d1424; --accent-soft:#1d2840;
  --brass:#d8b46c; --brass-on-band:#e3c27c; --sold:#e08b7e; --wa:#3fb874;
  --art-sky:#1d2537; --art-sun:#5b4f34; --art-ground:#242d40; --art-wall:#2c3549; --art-wall2:#232b3d; --art-win:#4a5672; --art-hl:#8eaeea; --art-tree:#3d6150;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 28px rgba(0,0,0,.3); color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
#app{min-height:100vh}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance}

/* masthead: light, dark type */
.mast{position:relative;overflow:hidden;background-color:var(--surface);color:var(--ink);border-bottom:1px solid var(--line)}
.mast::before{content:none}
.mast .wrap{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:22px;padding-block:44px 76px;min-height:400px;justify-content:center}
.mast-photo{display:block;position:absolute;top:0;bottom:0;left:0;height:100%;aspect-ratio:1/1;background-size:cover;background-position:center top;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(to right,#000 60%,transparent 100%);mask-image:linear-gradient(to right,#000 60%,transparent 100%)}
.mast .wrap{z-index:1}
.langwrap{position:absolute;z-index:3;top:calc(14px + env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-left,0px))}
.langbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0;font-size:11px;font-weight:700;letter-spacing:.04em}
.langbtn svg{width:20px;height:20px}
.langmenu{position:absolute;top:58px;inset-inline-end:0;list-style:none;margin:0;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:150px}
.langmenu button{width:100%;text-align:start;border:0;background:none;border-radius:9px;padding:9px 12px;font-weight:500;color:var(--ink)}
.langmenu button:hover{background:var(--accent-soft)}
.langmenu button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
@media (min-width:761px){html[dir="ltr"] .mast .wrap{align-items:flex-end}}
.brand{min-width:0;max-width:560px;display:flex;flex-direction:column;gap:14px}
.logo-row{display:flex;align-items:center;gap:16px}
.logo{width:68px;height:68px;flex:none;color:var(--accent)}
.logo-text{min-width:0;display:flex;flex-direction:column;gap:6px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,5.4vw,52px);line-height:1;margin:0;color:var(--ink)}
.services{font-size:15px;font-weight:500;letter-spacing:.06em;color:var(--brass)}
.slogan{margin:0;color:var(--ink);font-size:17px;max-width:52ch;border-inline-start:3px solid var(--brass);padding-inline-start:12px}
.mast-contact{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px}
.bigphone{font-family:var(--f-display);font-size:clamp(32px,5vw,46px);line-height:1;color:var(--accent);direction:ltr;unicode-bidi:isolate;user-select:all;letter-spacing:.02em}
.dealswitch{position:relative;margin-top:-34px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px;box-shadow:var(--shadow);max-width:560px}
.deal{border:0;background:transparent;border-radius:13px;padding:14px 12px;font-family:var(--f-display);font-size:24px;line-height:1.1;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:10px}
.deal b{font-family:var(--f-body);font-size:13px;font-weight:500;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 9px}
.deal[aria-pressed="true"]{background:var(--band);color:var(--band-ink)}
.deal[aria-pressed="true"] b{background:var(--brass-on-band);color:var(--band)}
.mast-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.wa:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.light{background:transparent;color:var(--band-ink);border-color:rgba(255,255,255,.35)}
.btn.danger{color:var(--sold);border-color:var(--sold);background:transparent}
.btn.danger.armed{background:var(--sold);color:#fff}
.btn svg{width:19px;height:19px;flex:none}
.phone{font-weight:500;direction:ltr;unicode-bidi:isolate}

/* featured */

/* ===== Design A: Luxury Minimal (ui-ux-pro-max) ===== */
:root{--bg:#FAFAF9;--surface:#FFFFFF;--ink:#1C1917;--muted:#57534E;--line:#E7E5E4;--band:#1C1917;--band-ink:#FAFAF9;--band-muted:#D6D3D1;--accent:#1C1917;--accent-ink:#FFFFFF;--accent-soft:#F5F5F4;--brass:#A16207;--brass-on-band:#E3B85C;--sold:#9F1239;--wa:#15803D;--field-line:#8A8580;--art-sky:#EEECE8;--art-sun:#E9D9B0;--art-ground:#D6D3D1;--art-wall:#FFFFFF;--art-wall2:#EEECE8;--art-win:#A8A29E;--art-hl:#A16207;--art-tree:#7C8A6E;--shadow:none;--f-display:"Bellefair","Noto Serif Hebrew",Georgia,serif;--f-body:"IBM Plex Sans Hebrew","Segoe UI",Arial,sans-serif}

:root[data-theme="dark"]{--bg:#0C0A09;--surface:#1C1917;--ink:#F5F5F4;--muted:#A8A29E;--line:#292524;--band:#000000;--band-ink:#F5F5F4;--band-muted:#A8A29E;--accent:#F5F5F4;--accent-ink:#1C1917;--accent-soft:#292524;--brass:#D4A84B;--brass-on-band:#E3B85C;--sold:#FDA4AF;--wa:#4ADE80;--field-line:#78716C;--art-sky:#292524;--art-sun:#5B4A2A;--art-ground:#1C1917;--art-wall:#3A3532;--art-wall2:#292524;--art-win:#57534E;--art-hl:#D4A84B;--art-tree:#4A5A42;--shadow:none;color-scheme:dark}
body{letter-spacing:.005em}

@media (hover:hover){.card:hover{transform:none;box-shadow:none;border-color:var(--muted)}}

/* ===== Design M: Bold Luxury Magazine (ui-ux-pro-max) ===== */
:root{--bg:#F4EFE6;--surface:#FFFDF8;--ink:#0B0B0B;--muted:#6B645C;--line:#E3DACB;--band:#0B0B0B;--band-ink:#F4EFE6;--band-muted:#B9B1A6;--accent:#0B0B0B;--accent-ink:#F4EFE6;--accent-soft:#EDE5D6;--brass:#7A5C17;--brass-on-band:#D4AF5A;--gold:#D4AF5A;--field-line:#8A8174;
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;--f-body:"Heebo","IBM Plex Sans Hebrew",system-ui,sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--surface:#151412;--ink:#F4EFE6;--muted:#B9B1A6;--line:#2A2722;--accent:#F4EFE6;--accent-ink:#0B0B0B;--accent-soft:#201E1A;--brass:#D4AF5A;--field-line:#6B645C}}
:root[data-theme="dark"]{--bg:#0B0B0B;--surface:#151412;--ink:#F4EFE6;--muted:#B9B1A6;--line:#2A2722;--accent:#F4EFE6;--accent-ink:#0B0B0B;--accent-soft:#201E1A;--brass:#D4AF5A;--field-line:#6B645C}
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);letter-spacing:0}
/* dark "editorial" zones keep their own palette in both themes */
.mast:not(.solo-mast),.featured,.owners,footer{--surface:#0B0B0B;--ink:#F4EFE6;--muted:#B9B1A6;--line:#2E2A24;--accent:#F4EFE6;--accent-ink:#0B0B0B;--accent-soft:#1A1815;--brass:#D4AF5A;--field-line:#6B645C}

/* hero */
.mast:not(.solo-mast){background:#0B0B0B;color:var(--ink);border:0}
.mast:not(.solo-mast)::after{content:"";position:absolute;inset:16px;border:1px solid rgba(212,175,90,.38);pointer-events:none;z-index:2}

.slogan{font-family:var(--f-display);font-weight:400;font-size:clamp(19px,2vw,24px);line-height:1.45;color:#D9D1C4;border-inline-start:2px solid var(--gold);padding-inline-start:18px}
.bigphone{font-family:var(--f-display);font-weight:500;font-size:clamp(38px,5.4vw,64px);color:var(--gold);letter-spacing:.03em}

/* sale / rent switch floats on the hero edge */
.dealswitch{margin-top:-42px;z-index:4;background:#0B0B0B;border:1px solid var(--gold);border-radius:0;padding:6px;gap:6px}
.deal{border-radius:0;color:#F4EFE6;background:transparent;font-family:var(--f-display);font-weight:500;font-size:20px;letter-spacing:.02em}

/* cards: alternating editorial rows with big index numbers */
.grid{gap:72px;counter-reset:apt;padding-bottom:80px}
.card{counter-increment:apt;background:transparent;border:0;border-radius:0;box-shadow:none;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0 44px;align-items:stretch}
.card:nth-child(even) .media{order:2}
.media{aspect-ratio:5/4;border-radius:0}
.media img,.media svg{transition:transform 1.2s var(--ease)}
@media (hover:hover){.card:hover .media img,.card:hover .media svg{transform:scale(1.06)}.card:hover{border-color:transparent}}
.card .body{padding:8px 0 0;border-top:1px solid var(--ink);gap:10px}
.card .body::before{content:counter(apt,decimal-leading-zero);display:block;font-family:var(--f-display);font-weight:900;font-size:clamp(64px,7vw,96px);line-height:.9;color:transparent;-webkit-text-stroke:1.2px var(--brass);margin:14px 0 6px;direction:ltr;text-align:start}
.card .price{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,3.8vw,48px)}
.card .loc{font-size:19px;font-weight:500}
.badge{border-radius:0;letter-spacing:.12em;font-weight:600}
.badge.excl,.badge.hotb{background:var(--gold);color:#0B0B0B}
.feat{border-radius:0}
.ref{letter-spacing:.06em}

/* owners band and footer */
.owners{border-radius:0;border:0;outline:1px solid var(--gold);outline-offset:-10px;padding:48px clamp(22px,5vw,60px);margin:24px 0 72px}
.owners h2{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,4.4vw,52px);color:var(--ink)}
footer{background:#0B0B0B;color:var(--muted);border:0;border-top:1px solid var(--gold)}
footer b{color:var(--ink)}
.solditem{border-radius:0}

/* buttons */
.btn{border-radius:0;font-weight:600;letter-spacing:.04em;transition:background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease)}
.btn.primary{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
@media (hover:hover){.btn:hover{transform:translateY(-1px)}}
.sheet{border-radius:0}

.owners .ghostwa{background:transparent;color:#7EE2A0;border-color:#4ADE80}

/* "Don't miss" button + picker */
.hotbtn{position:relative;display:inline-flex;align-items:center;gap:12px;min-height:56px;padding:12px 28px;border:0;cursor:pointer;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.02em;color:#0B0B0B;
  background:linear-gradient(100deg,#B8892E 0%,#F6DE9A 35%,#D4AF5A 55%,#B8892E 100%);background-size:220% 100%;box-shadow:0 10px 30px -10px rgba(212,175,90,.7);animation:mzShine 4s linear infinite;overflow:hidden}
.hotbtn .hotstar{font-size:24px;display:inline-block;animation:mzPulse 1.6s ease-in-out infinite}
.hotbtn b{font-family:var(--f-body);font-size:14px;background:#0B0B0B;color:#D4AF5A;min-width:26px;height:26px;display:inline-grid;place-items:center;border-radius:50%}
.hotbtn::after{content:"";position:absolute;inset:4px;border:1px solid rgba(11,11,11,.35);pointer-events:none}
.hotbtn:hover,.hotbtn:focus-visible{transform:translateY(-2px);box-shadow:0 16px 40px -12px rgba(212,175,90,.9);outline:2px solid #F6DE9A;outline-offset:3px}
.mast-hot{align-self:flex-start}
.section-title{flex-wrap:wrap;align-items:center}
.sec-hot{font-size:19px;min-height:48px;padding:10px 22px}
@keyframes mzPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.card.is-hot .media{outline:2px solid var(--gold);outline-offset:6px}
.card.is-hot .body{border-top-color:var(--gold);border-top-width:3px}
.sheet.is-hot{outline:1px solid var(--gold)}
.sheet .hotband{font-size:clamp(20px,3vw,30px);padding:14px 18px;margin:0;background:#0B0B0B!important;-webkit-background-clip:border-box;background-clip:border-box;color:#D4AF5A!important;animation:none}
.hotpick{max-width:860px}
.hotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;padding:20px}
.hotitem{display:flex;flex-direction:column;text-align:start;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;cursor:pointer;font:inherit}
.hotitem:hover,.hotitem:focus-visible{border-color:var(--gold);outline:none}
.hotmedia{position:relative;aspect-ratio:4/3;overflow:hidden;background:var(--art-sky)}
.hotmedia img,.hotmedia svg{width:100%;height:100%;object-fit:cover;display:block}
.hottext{display:flex;flex-direction:column;gap:4px;padding:14px 16px}
.hottext .price{font-size:28px;color:var(--brass)}
@media (max-width:760px){.hotbtn{font-size:19px;padding:10px 20px;width:100%;justify-content:center}.sec-hot{width:auto}}
@media (prefers-reduced-motion:reduce){.hotbtn,.hotbtn .hotstar{animation:none}}
/* scroll reveal */
.rv{opacity:0;transform:translateY(40px)}
.rv.in{opacity:1;transform:none;transition:opacity 1s var(--ease),transform 1s var(--ease)}

@media (max-width:760px){
  .mast:not(.solo-mast) .wrap{min-height:0;padding-block:72px 84px}
  .mast:not(.solo-mast) .mast-photo{width:100%;opacity:.42;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent 95%);mask-image:linear-gradient(to bottom,#000 30%,transparent 95%)}
  .mast:not(.solo-mast)::after{inset:10px}
  .featured .fgrid{grid-template-columns:1fr}.featured .fmedia{min-height:0;aspect-ratio:4/3}.featured .ftext{padding:28px 22px}
  .card{grid-template-columns:1fr;gap:0}.card:nth-child(even) .media{order:0}
  .card .body::before{font-size:56px}
  .grid{gap:48px}
}
@media (prefers-reduced-motion:reduce){
  .rv{opacity:1;transform:none}.rv.in{transition:none}
  .mast.intro .brand>*,.mast.intro .mast-contact,.mast.intro .mast-social,.mast.intro .mast-photo{animation:none}
  .hotband{animation:none;background-position:50% 0}
  .media img,.media svg,.featured .fmedia img,.btn{transition:none}
}

/* ===== Design C: Cinematic (inspired by video-led studio sites) ===== */
:root,:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:dark;--bg:#050505;--surface:#0E0E0E;--ink:#F2F0EC;--muted:#A3A09A;--line:#232323;--band:#000;--band-ink:#F2F0EC;--band-muted:#A3A09A;--accent:#F2F0EC;--accent-ink:#050505;--accent-soft:#171717;--brass:#E6C27A;--brass-on-band:#E6C27A;--gold:#E6C27A;--field-line:#55524D;--sold:#F08A8A;--wa:#1F9D55;
  --f-display:"Heebo","IBM Plex Sans Hebrew",system-ui,sans-serif;--f-body:"Heebo","IBM Plex Sans Hebrew",system-ui,sans-serif}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){color-scheme:dark;--bg:#050505;--surface:#0E0E0E;--ink:#F2F0EC;--muted:#A3A09A;--line:#232323;--accent:#F2F0EC;--accent-ink:#050505;--accent-soft:#171717;--brass:#E6C27A;--field-line:#55524D}}
html,body{background:#050505}
body{font-weight:400}
.mast:not(.solo-mast),.featured,.owners,footer{--surface:#0E0E0E;--ink:#F2F0EC;--muted:#A3A09A;--line:#232323;--brass:#E6C27A}

/* hero: full-screen video */
.mast:not(.solo-mast){min-height:100svh;display:flex;align-items:flex-end;background:#000}
.mast:not(.solo-mast)::after{inset:0;border:0;background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 35%,rgba(0,0,0,.7) 78%,#050505 100%);z-index:1}
.herovid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;filter:saturate(1.05) contrast(1.05)}
.mast:not(.solo-mast) .mast-photo{z-index:1;width:min(34vw,440px);height:72%;top:auto;bottom:0;left:clamp(16px,5vw,80px);aspect-ratio:auto;background-position:center top;-webkit-mask-image:linear-gradient(to top,transparent 0%,#000 30%);mask-image:linear-gradient(to top,transparent 0%,#000 30%);filter:none}
.mast:not(.solo-mast) .wrap{z-index:3;min-height:0;width:100%;padding-block:120px 120px;gap:26px}
.mast .logo{color:var(--ink)}
.brand{max-width:780px}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:clamp(52px,10vw,148px);line-height:.88;letter-spacing:-.035em;color:#fff;text-wrap:balance}
.services{font-weight:500;letter-spacing:.32em;color:#fff;opacity:.8;font-size:13px}
.slogan{font-family:var(--f-body);font-weight:300;font-size:clamp(20px,2.2vw,28px);color:#EDEAE4;border:0;padding:0;max-width:30ch;line-height:1.35}
.bigphone{font-family:var(--f-display);font-weight:800;color:#fff;font-size:clamp(30px,4vw,48px);letter-spacing:.01em}
.mast .btn:not(.wa){border-color:rgba(255,255,255,.5);color:#fff;backdrop-filter:blur(6px);background:rgba(0,0,0,.25)}
.mast .btn:not(.wa):hover,.mast .btn:not(.wa):focus-visible{background:#fff;color:#000;border-color:#fff}
.scrollcue{position:absolute;z-index:3;bottom:22px;left:50%;transform:translateX(-50%);color:#fff;opacity:.75;font:500 12px var(--f-body);letter-spacing:.3em;display:flex;flex-direction:column;align-items:center;gap:8px}
.scrollcue::after{content:"";width:1px;height:42px;background:linear-gradient(#fff,transparent);animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* marquee strip */
.marq{overflow:hidden;border-block:1px solid var(--line);background:#050505;padding:18px 0;direction:ltr}
.marq>div{display:flex;width:max-content;gap:48px;animation:marq 38s linear infinite;font:900 clamp(28px,4vw,54px)/1 var(--f-display);letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px #6d6a65}
.marq span{white-space:nowrap;direction:rtl}
.marq b{color:var(--gold);-webkit-text-stroke:0;font-weight:900}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* switch */
.dealswitch{margin-top:44px;background:transparent;border:1px solid var(--line);max-width:520px}
.deal{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
.deal[aria-pressed="true"]{background:#fff;color:#000}
.deal b{border-color:currentColor!important;color:inherit!important}
.deal[aria-pressed="true"] b{color:#000!important}

/* section title */
.section-title{border-top:0;margin-top:64px;padding-top:0;align-items:flex-end}
.section-title h2{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,7vw,104px);letter-spacing:-.04em;line-height:.9;color:#fff}
.tab,.chip{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:#fff;color:#000;border-color:#fff}
.filters{border-bottom:1px solid var(--line)}
.filters select,.filters input{background:#0E0E0E;color:var(--ink)}

/* listings as cinematic tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;counter-reset:apt}
.card{position:relative;display:block;overflow:hidden;background:#0E0E0E;min-height:0}
.card:nth-child(even) .media{order:0}
.card .media{aspect-ratio:4/5;width:100%}
.card .media img,.card .media svg{transition:transform 1.6s cubic-bezier(.2,.7,.2,1),filter .8s}
.card .body{position:absolute;inset:auto 0 0 0;padding:120px 28px 24px;border:0;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.72) 45%,rgba(0,0,0,.92) 100%);color:#fff;gap:6px;pointer-events:auto}
.card .body::before{position:absolute;top:22px;inset-inline-start:28px;margin:0;font:900 22px var(--f-display);color:#fff;-webkit-text-stroke:0;opacity:.85;letter-spacing:.1em}
.card .price{color:#fff;font-weight:900;font-size:clamp(30px,3vw,42px);letter-spacing:-.02em}
.card .loc{color:#EDEAE4;font-size:18px}
.card .specs{color:#D8D4CD}
.card .feats{display:none}
.card .card-foot{padding-top:10px;border-top:1px solid rgba(255,255,255,.18)}
.card .ref{color:#B8B4AE}
.card .body::after{content:"לפרטים ›";position:absolute;top:22px;inset-inline-end:28px;font:700 14px var(--f-body);letter-spacing:.12em;color:#fff;padding:8px 14px;border:1px solid rgba(255,255,255,.6);opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s}
html[lang="en"] .card .body::after{content:"View ›"}
@media (hover:hover){.card:hover .media img,.card:hover .media svg{transform:scale(1.08)}.card:hover .body::after{opacity:1;transform:none}}
.card .badges{z-index:2;top:22px;inset-inline-start:auto;inset-inline-end:28px}
@media (hover:hover){.card:hover .badges{opacity:0}}
.card .pcount{display:none}
.card.is-hot .media{outline:0}
.card.is-hot{outline:2px solid var(--gold);outline-offset:-2px}
.card.is-hot .body{border:0}
.card.is-sold .media{filter:grayscale(1) brightness(.6)}

/* hot button: white + gold */
.hotbtn{font-family:var(--f-display);font-weight:900;color:#000}
.mast-hot{margin-top:4px}

/* owners CTA */
.owners{outline:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#050505;text-align:center;justify-content:center;padding:90px 20px;margin:40px 0 0}
.owners-text{flex:1 1 100%}
.owners h2{font-family:var(--f-display);font-weight:900;font-size:clamp(44px,7vw,110px);letter-spacing:-.04em;line-height:.92;color:#fff;margin-bottom:18px}
.owners p{margin-inline:auto;font-size:19px}
.owners-acts{justify-content:center;flex:1 1 100%}
footer{border-top:1px solid var(--line);background:#000}
.sheet{background:#0E0E0E;color:var(--ink)}
.solditem{background:#0E0E0E}

@media (max-width:760px){
  .mast:not(.solo-mast){min-height:100svh}
  .mast:not(.solo-mast){flex-direction:column;align-items:stretch;justify-content:flex-end}
  .mast:not(.solo-mast) .mast-photo{display:block;position:relative;z-index:3;left:auto;bottom:auto;width:132px;height:164px;margin:84px 16px 0 auto;-webkit-mask-image:none;mask-image:none;border:1px solid rgba(255,255,255,.35);opacity:1}
  .mast:not(.solo-mast) .wrap{padding-block:20px 70px}
  .grid{grid-template-columns:1fr;gap:16px}
  .card .media{aspect-ratio:4/5}
  .card .body{padding:110px 20px 18px}
  .scrollcue{display:none}
}
@media (prefers-reduced-motion:reduce){.marq>div,.scrollcue::after{animation:none}.card .media img{transition:none}}

/* ===== Design C2: Cinematic, light edition ===== */
:root,:root:not([data-theme="x"]),:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:light;--bg:#F6F2EB;--surface:#FFFFFF;--ink:#161514;--muted:#5F5A52;--line:#E4DCCF;--band:#EFE7DA;--band-ink:#161514;--band-muted:#5F5A52;--accent:#161514;--accent-ink:#FFFFFF;--accent-soft:#F0EAE0;--brass:#7A5C17;--brass-on-band:#7A5C17;--gold:#B48A3C;--field-line:#8A8174;--sold:#9F1239;--wa:#15803D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light;--bg:#F6F2EB;--surface:#FFFFFF;--ink:#161514;--muted:#5F5A52;--line:#E4DCCF;--accent:#161514;--accent-ink:#FFFFFF;--accent-soft:#F0EAE0;--brass:#7A5C17;--gold:#B48A3C;--field-line:#8A8174}}
html,body{background:#F6F2EB}
.owners,footer{--surface:#FFFFFF;--ink:#161514;--muted:#5F5A52;--line:#E4DCCF;--brass:#7A5C17}
.mast:not(.solo-mast){--ink:#FFFFFF;--muted:#E8E3DA}
.mast:not(.solo-mast)::after{background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.18) 38%,rgba(0,0,0,.5) 80%,rgba(0,0,0,.62) 100%)}
.mast:not(.solo-mast){background:#2A2723}
.heroslides{position:absolute;inset:0;z-index:0;overflow:hidden}
.heroslides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.04);transition:opacity 1.6s ease,transform 7s linear}
.heroslides img.on{opacity:1;transform:scale(1.14)}
/* contact marquee: each item is a button */
.marq{background:#FFFFFF;border-block:1px solid var(--line);padding:14px 0;display:flex;align-items:center;gap:0}
.mqlabel{flex:none;direction:rtl;padding-inline:18px 14px;font:700 15px var(--f-body);color:var(--brass);border-inline-start:1px solid var(--line);white-space:nowrap;order:2;background:#fff;position:relative;z-index:1}
.mqtrack{flex:1;overflow:hidden;order:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.marq>div.mqtrack{animation:none;color:inherit;-webkit-text-stroke:0;width:auto;display:block;font:inherit;gap:0}
.mqtrack>div{display:flex;width:max-content;gap:14px;animation:marq 40s linear infinite;color:var(--ink);-webkit-text-stroke:0;font:inherit}
.marq:hover .mqtrack>div,.marq:focus-within .mqtrack>div{animation-play-state:paused}
.mqset{display:flex;gap:14px;padding-inline-end:14px}
.mq{direction:rtl;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;min-height:52px;padding:10px 22px;border:1.5px solid var(--gold);border-radius:999px;background:#FFFCF6;color:var(--ink);text-decoration:none;font:800 clamp(18px,2.2vw,24px)/1 var(--f-display);transition:background-color .25s,color .25s,transform .25s}
.mq svg{width:20px;height:20px;flex:none;color:#15803D}
.mq .arr{font-weight:400;color:var(--brass)}
.mq:hover,.mq:focus-visible{background:var(--ink);color:#fff;border-color:var(--ink);outline:none;transform:translateY(-2px)}
.mq:hover .arr,.mq:focus-visible .arr{color:#F3D58C}
.mq:focus-visible{box-shadow:0 0 0 3px #F3D58C}
/* content on light */
.dealswitch{background:#FFFFFF;border:1px solid var(--line)}
.deal{color:var(--muted)}
.deal[aria-pressed="true"]{background:var(--ink);color:#fff}
.deal[aria-pressed="true"] b{color:#fff!important}
.section-title h2{color:var(--ink)}
.tab,.chip{background:#fff;border:1px solid var(--line);color:var(--ink)}
.tab[aria-pressed="true"],.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters select,.filters input{background:#fff;color:var(--ink)}
.card{background:#fff;box-shadow:0 18px 40px -26px rgba(40,30,15,.45)}
.owners{background:var(--band);border-color:var(--line)}
.owners h2{color:var(--ink)}
.owners p{color:var(--muted)}
.owners .ghostwa{background:#fff;color:#0F6B33;border-color:#15803D}
footer{background:#EFE7DA;color:var(--muted);border-top:1px solid var(--line)}
footer b{color:var(--ink)}
.foot-social .soc{color:var(--ink);border-color:var(--line)}
.sheet{background:#FFFFFF;color:var(--ink)}
.solditem{background:#fff}
.hotitem{background:#fff}
@media (max-width:760px){.mqlabel{display:none}.mq{min-height:46px;padding:8px 16px}}
@media (prefers-reduced-motion:reduce){.mqtrack>div{animation:none}.mqtrack{overflow-x:auto}.heroslides img{transition:opacity .01s}}

/* ===== hero v3: calm dream-home art + video bubble ===== */
.herovid,.heroslides{display:none!important}
.mast:not(.solo-mast){background:#2B2A3E}
.heroart{position:absolute;inset:0;z-index:0;overflow:hidden}
.heroart img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;animation:artDrift 40s ease-in-out infinite alternate;transform-origin:30% 50%;opacity:0;transition:opacity 1.6s ease}.heroart img.ok{opacity:1}
@keyframes artDrift{from{transform:scale(1)}to{transform:scale(1.06)}}
.mast:not(.solo-mast)::after{background:linear-gradient(270deg,rgba(18,16,30,.72) 0%,rgba(18,16,30,.45) 32%,rgba(18,16,30,.08) 62%,rgba(0,0,0,0) 100%),linear-gradient(180deg,rgba(0,0,0,0) 72%,rgba(246,242,235,.0) 88%,#F6F2EB 100%)}
.mast:not(.solo-mast) .mast-photo{-webkit-mask-image:linear-gradient(to top,transparent 0%,#000 26%);mask-image:linear-gradient(to top,transparent 0%,#000 26%)}
.vidbubble{position:absolute;z-index:4;top:104px;bottom:auto;left:calc(clamp(16px,5vw,80px) + min(34vw,440px) - 110px);width:180px;height:180px;padding:0;border:0;background:none;cursor:pointer;border-radius:50%}
.vbface{position:absolute;inset:0;border-radius:50%;overflow:hidden;border:3px solid #E9C987;box-shadow:0 18px 40px -12px rgba(0,0,0,.6);background:#222}
.vbface video,.vbface img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vbface img{opacity:0;transition:opacity 1.2s ease}.vbface img.on{opacity:1}
.vbring{position:absolute;inset:-10px;border-radius:50%;border:1px solid rgba(233,201,135,.7);animation:vbPulse 3s ease-out infinite}
@keyframes vbPulse{0%{transform:scale(.94);opacity:.9}100%{transform:scale(1.12);opacity:0}}
.vblabel{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);white-space:nowrap;background:#FFFCF6;color:#161514;font:700 14px var(--f-body);padding:7px 14px;border-radius:999px;border:1px solid #E9C987;direction:rtl}
.vidbubble:hover .vbface,.vidbubble:focus-visible .vbface{border-color:#fff;transform:scale(1.03);transition:transform .3s}
.vidbubble:focus-visible{outline:3px solid #F3D58C;outline-offset:8px}

/* ===== Design E: clean premium (top nav, calm hero, featured opportunity in the middle) ===== */
:root,:root:not([data-theme="x"]),:root[data-theme="light"],:root[data-theme="dark"]{color-scheme:light;--bg:#FAF8F4;--surface:#FFFFFF;--ink:#1C1B19;--muted:#6B665E;--line:#E7E1D6;--accent:#1C1B19;--accent-ink:#FFFFFF;--accent-soft:#F2EEE6;--brass:#8C6A2E;--gold:#B08D4C;--wa:#15803D;
  --lx-serif:"Frank Ruhl Libre","Times New Roman",serif;--lx-sans:"Heebo","IBM Plex Sans Hebrew",system-ui,sans-serif;--f-body:var(--lx-sans)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:light;--bg:#FAF8F4;--surface:#FFFFFF;--ink:#1C1B19;--muted:#6B665E;--line:#E7E1D6;--accent:#1C1B19;--accent-ink:#fff;--accent-soft:#F2EEE6;--brass:#8C6A2E;--gold:#B08D4C}}
html,body{background:#FAF8F4!important}
body{font-family:var(--lx-sans);color:var(--ink)}
#app.with-side{padding-inline-start:0!important}
#main,#lx-hot,#lx-contact,#top{scroll-margin-top:84px}

/* shared atoms */
.lx-kicker{display:inline-block;font:500 12px/1.4 var(--lx-sans);letter-spacing:.28em;color:var(--brass)}
.lx-cap{display:block;font:500 11px/1.4 var(--lx-sans);letter-spacing:.24em;color:var(--brass);margin-bottom:14px}
.lx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:0;border:1px solid var(--ink);font:500 15px/1 var(--lx-sans);letter-spacing:.04em;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s}
.lx-btn svg{width:18px;height:18px;flex:none}
.lx-btn-dark{background:var(--ink);color:#fff}
.lx-btn-dark:hover{background:#3A3833;border-color:#3A3833}
.lx-btn-line{background:transparent;color:var(--ink)}
.lx-btn-line:hover{background:var(--ink);color:#fff}
.lx-btn-light{background:#fff;color:var(--ink);border-color:#fff}
.lx-btn-light:hover{background:transparent;color:#fff}
.lx-btn:focus-visible,.lx-link:focus-visible,.lx-brand:focus-visible,.lx-wa:focus-visible,.lx-burger:focus-visible,.lx-socb:focus-visible,.lx-deal button:focus-visible,.lx-hotmedia:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.lx-arr{display:inline-block;transition:transform .2s}
#app[dir="ltr"] .lx-arr{transform:scaleX(-1)}
.lx-btn:hover .lx-arr{transform:translateX(-4px)}

/* top navigation */
.lx-nav{position:sticky;top:0;z-index:20;background:rgba(250,248,244,.92);-webkit-backdrop-filter:saturate(1.2) blur(12px);backdrop-filter:saturate(1.2) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lx-nav-in{max-width:1240px;margin:0 auto;height:72px;display:flex;align-items:center;gap:28px;padding-inline:max(20px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-left,0px))}
.lx-brand{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);text-align:start;min-width:0}
.lx-brand .logo{width:30px;height:30px;color:var(--gold);flex:none}
.lx-bn{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.lx-bn b{font:500 21px/1.1 var(--lx-serif);color:var(--ink);white-space:nowrap}
.lx-bn small{font:400 12px var(--lx-sans);color:var(--muted);letter-spacing:.06em;white-space:nowrap}
.lx-links{display:flex;align-items:center;gap:6px;margin-inline:auto}

.lx-link::after{content:"";position:absolute;inset-inline:14px;bottom:4px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .25s}

.lx-tools{display:flex;align-items:center;gap:8px;flex:none}

.lx-tools .langmenu,.lx-tools .sharemenu{top:52px;z-index:30}
.lx-wa{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font:500 14px var(--lx-sans);letter-spacing:.03em}
.lx-wa svg{width:17px;height:17px}
.lx-wa:hover{background:#3A3833}
.lx-burger{display:none;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer;padding:0}
.lx-burger svg{width:20px;height:20px}
.lx-scrim{position:fixed;inset:0;z-index:40;background:rgba(28,27,25,.38);animation:lxFade .2s ease}

.lx-dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.lx-dx{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:24px;line-height:1;color:var(--ink);cursor:pointer;flex:none}
.lx-dlinks{display:flex;flex-direction:column;padding:14px 0}
.lx-dlink{background:none;border:0;border-bottom:1px solid var(--line);padding:18px 2px;text-align:start;font:400 24px var(--lx-serif);color:var(--ink);cursor:pointer}

.lx-dsoc{padding:18px 0}

.lx-socb{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);font:400 14px var(--lx-sans);cursor:pointer}

/* hero */
.lx-hero{background:#FAF8F4;overflow:hidden}
.lx-hero-in{max-width:1240px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(32px,6vw,96px);align-items:center;padding-block:clamp(56px,9vh,110px)}

.lx-rule{display:block;width:64px;height:1px;background:var(--gold);margin:30px 0 26px}
.lx-tag{font:300 clamp(18px,1.6vw,22px)/1.6 var(--lx-sans);color:var(--muted);max-width:34ch;margin:0}
.lx-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}
.lx-hphone{margin-top:30px;font:400 15px var(--lx-sans);letter-spacing:.14em;color:var(--muted);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px}

.lx-hero-pic{position:relative;margin:0;justify-self:end;width:100%;max-width:440px}

.lx-hero-pic figcaption span{font:400 12px var(--lx-sans);color:var(--muted);letter-spacing:.06em}

/* opportunity — centred, mid-page */
.lx-hot{background:#F2EEE6;border-block:1px solid var(--line);padding:clamp(64px,10vw,120px) 0}
.lx-sec-head{text-align:center;max-width:640px;margin:0 auto clamp(36px,5vw,56px)}
.lx-sec-head h2{font:400 clamp(34px,4.4vw,56px)/1.1 var(--lx-serif);margin:14px 0 14px;color:var(--ink)}
.lx-sec-head p{font:300 18px/1.6 var(--lx-sans);color:var(--muted);margin:0}
.lx-hotcard{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:#fff;box-shadow:0 30px 60px -40px rgba(28,27,25,.35)}
.lx-hotcard+.lx-hotcard{margin-top:28px}
.lx-hotmedia{position:relative;min-height:440px;overflow:hidden;cursor:pointer;background:#E9E3D8}
.lx-hotmedia>img,.lx-hotmedia>svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.4s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.lx-hotmedia:hover>img{transform:scale(1.04)}}
.lx-pc{position:absolute;bottom:16px;inset-inline-end:16px;background:rgba(255,255,255,.92);color:var(--ink);font:500 12px var(--lx-sans);padding:6px 12px;letter-spacing:.04em}
.lx-hotvid .vidbubble{position:absolute;top:auto;bottom:22px;left:auto;inset-inline-start:22px;width:118px;height:118px;margin:0}
.lx-hotvid .vbface{border:2px solid #fff}
.lx-hotvid .vbring{border-color:rgba(255,255,255,.7)}
.lx-hotvid .vblabel{font-size:12px;padding:5px 10px;border-color:#fff}
.lx-hotinfo{padding:clamp(28px,4vw,52px);display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.lx-eyebrow{font:500 12px var(--lx-sans);letter-spacing:.22em;color:var(--brass)}
.lx-hotinfo h3{font:400 clamp(26px,2.6vw,34px)/1.2 var(--lx-serif);margin:6px 0 4px;color:var(--ink)}
.lx-price{font:500 clamp(28px,2.8vw,36px)/1.2 var(--lx-serif);color:var(--ink);margin-top:6px}
.lx-price *{font:inherit}
.lx-specs{display:flex;gap:0;margin:22px 0 4px;padding:18px 0;border-block:1px solid var(--line);width:100%}
.lx-specs>div{flex:1;padding-inline:14px;border-inline-start:1px solid var(--line)}
.lx-specs>div:first-child{padding-inline-start:0;border:0}
.lx-specs dt{font:400 12px var(--lx-sans);color:var(--muted);letter-spacing:.08em}
.lx-specs dd{margin:4px 0 0;font:500 20px var(--lx-serif);color:var(--ink)}
.lx-desc{font:300 16px/1.7 var(--lx-sans);color:var(--muted);margin:14px 0 0}
.lx-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto;padding-top:26px}
.lx-acts .btn{border-radius:0;min-height:50px}

/* listings */
#main{max-width:1240px}
.section-title.lx-st{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px;margin:clamp(56px,8vw,96px) 0 26px;padding:0;border:0}
.lx-st h2{font:400 clamp(32px,4vw,52px)/1.1 var(--lx-serif)!important;letter-spacing:0!important;color:var(--ink)!important;margin:10px 0 0}
.lx-deal{display:flex;border:1px solid var(--ink)}
.lx-deal button{min-height:44px;padding:0 22px;border:0;background:transparent;color:var(--ink);font:400 15px var(--lx-sans);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.lx-deal button b{font-size:12px;font-weight:500;color:var(--muted)}
.lx-deal button[aria-pressed="true"]{background:var(--ink);color:#fff}
.lx-deal button[aria-pressed="true"] b{color:#D8D2C6}
#main .tabs{gap:6px;border:0;margin-bottom:6px}
#main .tab,#main .chip{border-radius:0;background:transparent;border:1px solid var(--line);color:var(--ink);font-family:var(--lx-sans);font-weight:400}
#main .tab[aria-pressed="true"],#main .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#main .filters{border:0;border-block:1px solid var(--line);padding-block:18px;margin-bottom:36px}
#main .filters select,#main .filters input[type="text"]{border-radius:0;background:#fff}
#main .filters label,#main .filters .flabel{letter-spacing:.08em;color:var(--muted)}
#main .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}
#main .card{display:flex;flex-direction:column;background:transparent;box-shadow:none;outline:0;border:0;overflow:visible;border-radius:0}
#main .card .media{position:relative;aspect-ratio:4/3;width:100%;overflow:hidden;border-radius:0;background:#E9E3D8}
#main .card .media img,#main .card .media svg{width:100%;height:100%;object-fit:cover}
#main .card .body{position:static;inset:auto;background:transparent;color:var(--ink);padding:18px 0 0;border:0;gap:6px;display:flex;flex-direction:column}
#main .card .body::before,#main .card .body::after{content:none;display:none}
#main .card .price{font:500 24px/1.2 var(--lx-serif);color:var(--ink);letter-spacing:0}
#main .card .loc{font:400 16px var(--lx-sans);color:var(--ink)}
#main .card .loc em{color:var(--muted);font-style:normal}
#main .card .specs{color:var(--muted);font-size:14px;gap:14px}
#main .card .specs b{color:var(--ink);font-weight:500}
#main .card .feats{display:none}
#main .card .card-foot{border-top:1px solid var(--line);padding-top:14px;margin-top:8px}
#main .card .ref{color:var(--muted)}
#main .card .btn{border-radius:0}
#main .card .badges{top:14px;inset-inline-start:14px;inset-inline-end:auto}
#main .card .badge{border-radius:0;background:rgba(255,255,255,.94);color:var(--ink);border:0;font:500 11px var(--lx-sans);letter-spacing:.1em}
#main .card .badge.hotb{background:var(--ink);color:#fff}
#main .card.is-hot{outline:0}
#main .card.is-hot .media{outline:1px solid var(--gold);outline-offset:-1px}
@media (hover:hover){#main .card:hover .badges{opacity:1}#main .card:hover .media img{transform:scale(1.05)}}
#main .card .media img{transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}

/* owners band */
.owners{background:var(--ink)!important;color:#fff;border:0!important;padding:clamp(64px,9vw,110px) 24px!important;margin:clamp(64px,9vw,110px) 0 0!important;border-radius:0!important}
.owners h2{font:400 clamp(32px,4.2vw,54px)/1.15 var(--lx-serif)!important;letter-spacing:0!important;color:#fff!important}
.owners p{color:#CFC8BB!important;font:300 18px/1.6 var(--lx-sans)!important}
.owners .btn{border-radius:0!important;min-height:50px}
.owners .ghostwa{background:transparent!important;color:#fff!important;border-color:rgba(255,255,255,.5)!important}

/* footer */
.lx-foot{background:#141311!important;color:#CFC8BB!important;border:0!important;padding:clamp(56px,7vw,84px) 0 0}
.lx-foot-in{max-width:1240px;display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px;padding-bottom:48px}
.lx-fbrand{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.lx-fbrand .logo{width:34px;height:34px;color:var(--gold);margin-bottom:12px}
.lx-fbrand b{font:400 26px var(--lx-serif);color:#fff}
.lx-fbrand span{font-size:13px;letter-spacing:.06em}
.lx-fbrand p{max-width:36ch;font:300 15px/1.6 var(--lx-sans);margin:14px 0 0;color:#A39C8F}
.lx-foot .lx-cap{color:var(--gold)}
.lx-fcol{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.lx-fphone{font:400 30px var(--lx-serif);color:#fff;text-decoration:none}
.lx-foot .lx-socb{color:#fff;border-color:rgba(255,255,255,.22)}
.lx-foot .lx-socb:hover{border-color:#fff}
.lx-legal{max-width:1240px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 30px;border-top:1px solid rgba(255,255,255,.12);padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));font-size:13px;color:#8F887B}
.lx-foot b{color:#fff}

/* responsive */
@media (max-width:1080px){.lx-links{display:none}.lx-burger{display:inline-flex}.lx-tools{margin-inline-start:auto}}
@media (max-width:900px){#main .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.lx-hotcard{grid-template-columns:1fr}.lx-hotmedia{min-height:0;aspect-ratio:4/3}.lx-foot-in{grid-template-columns:1fr 1fr}.lx-fbrand{grid-column:1/-1}}
@media (max-width:760px){
  .lx-nav-in{height:64px;gap:10px;padding-inline:16px}
  #main,#lx-hot,#lx-contact,#top{scroll-margin-top:72px}
  .lx-bn b{font-size:18px}.lx-bn small{display:none}
  .lx-tools .sharebtn,.lx-tools>.topbtn-wrap:first-child{display:none}
  .lx-wa{width:42px;padding:0;justify-content:center}.lx-wa span{display:none}
  .lx-hero-in{grid-template-columns:1fr;gap:40px;padding-block:36px 64px}
  .lx-hero-pic{order:-1;justify-self:center;max-width:300px;margin-inline:22px}
  .lx-hero-txt{align-items:center;text-align:center}
  .lx-rule{margin:24px auto 22px}
  .lx-tag{margin-inline:auto}
  .lx-cta{flex-direction:column;align-items:stretch;width:100%;margin-top:32px}
  .lx-cta .lx-btn{width:100%}
  .lx-hphone{align-self:center}
  .lx-hotinfo{padding:26px 20px 28px}
  .lx-acts{width:100%}.lx-acts .lx-btn,.lx-acts .btn{flex:1 1 100%}
  .lx-hotvid .vidbubble{width:92px;height:92px;bottom:14px;inset-inline-start:14px}
  .section-title.lx-st{flex-direction:column;align-items:flex-start}
  .lx-deal{width:100%}.lx-deal button{flex:1;justify-content:center}
  #main .grid{grid-template-columns:1fr;gap:34px}
  .lx-foot-in{grid-template-columns:1fr;gap:34px}
}
@media (prefers-reduced-motion:reduce){.lx-scrim,.lx-drawer{animation:none}.lx-hotmedia>img,#main .card .media img{transition:none}}

#main .card .btn.wa{background:transparent!important;color:var(--ink)!important;border:1px solid var(--ink)!important;min-height:42px}
#main .card .btn.wa:hover{background:var(--ink)!important;color:#fff!important}
.owners{box-shadow:0 0 0 100vmax var(--ink);clip-path:inset(0 -100vmax)}
.owners .btn.wa:not(.ghostwa){background:#fff!important;color:var(--ink)!important;border-color:#fff!important}
.lx-foot{padding-top:clamp(56px,7vw,84px)!important;margin-top:0;border-top:1px solid rgba(255,255,255,.1)!important}
html.lowvision .lx-tag,html.lowvision .lx-desc,html.lowvision .lx-sec-head p{color:var(--ink)}
/* ===== E2: single clean home, menu on the right ===== */
.lx-nav-in{display:grid!important;grid-template-columns:1fr auto 1fr;gap:16px!important}
.lx-burger{display:inline-flex!important;justify-self:start;width:auto!important;height:44px!important;padding:0 18px 0 16px!important;border-radius:999px!important;border:1px solid var(--ink)!important;gap:10px;font:500 15px var(--lx-sans);color:var(--ink)}
.lx-burger:hover{background:var(--ink);color:#fff}
.lx-brand{justify-self:center;text-align:center}
.lx-brand .lx-bn{align-items:center}
.lx-tools{justify-self:end;margin:0!important}
.lx-wa{width:42px;padding:0!important;justify-content:center}
.lx-dlink{display:flex;align-items:center;gap:14px;font-size:22px!important}
.lx-dic{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;color:var(--brass)}
.lx-dic svg{width:18px;height:18px}
.lx-dl{flex:1}
.lx-dlink b{font:500 12px var(--lx-sans);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.lx-dlink[aria-current="page"] .lx-dic{border-color:var(--gold);background:#F2EEE6}
.lx-dlink:hover{color:var(--brass)}
/* home: one calm screen */
.lx-home{min-height:calc(100svh - 73px);display:flex;flex-direction:column;background:#FAF8F4}
.lx-home-in{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;max-width:1120px;margin:0 auto;padding:clamp(24px,4vh,48px) 20px;box-sizing:border-box}
.lx-home .lx-sec-head{margin:0 auto clamp(20px,3.5vh,36px)}
.lx-home .lx-sec-head h2{font-size:clamp(28px,3.4vw,44px);margin:10px 0 0}
.lx-home .lx-hotcard{width:100%;box-shadow:0 30px 70px -45px rgba(28,27,25,.45);border:1px solid var(--line)}
.lx-home .lx-hotmedia{min-height:min(56vh,500px)}
.lx-home .lx-hotinfo{padding:clamp(24px,3vw,44px)}
.lx-home .lx-specs{margin:16px 0 0;padding:14px 0}
.lx-home .lx-desc{margin-top:12px;font-size:15px}
.lx-home .lx-acts{padding-top:20px}
.lx-more{margin-top:22px;background:none;border:0;border-bottom:1px solid var(--gold);padding:4px 2px;font:400 16px var(--lx-sans);color:var(--ink);cursor:pointer}
.lx-hbar{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 28px;padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font:400 13px var(--lx-sans);color:var(--muted);letter-spacing:.06em}
.lx-hbar a{color:var(--ink);text-decoration:none;letter-spacing:.12em}
.lx-empty-home{text-align:center;display:flex;flex-direction:column;align-items:center}
.lx-empty-home h1{font:400 clamp(44px,6vw,84px)/1.05 var(--lx-serif);margin:18px 0 0}
.lx-empty-home .lx-rule{margin:26px auto 22px}
@media (max-width:900px){.lx-home .lx-hotmedia{min-height:0;aspect-ratio:16/10}}
@media (max-width:760px){
  .lx-nav-in{grid-template-columns:auto 1fr auto;gap:10px!important}
  .lx-burger{padding:0 14px!important;height:42px!important;font-size:14px}
  .lx-brand .lx-bn b{font-size:17px}
  .lx-home{min-height:calc(100svh - 65px)}
  .lx-home-in{justify-content:flex-start;padding:22px 16px 28px}
  .lx-home .lx-sec-head{margin-bottom:18px}
  .lx-home .lx-hotinfo{padding:22px 18px 24px}
  .lx-home .lx-desc{display:none}
}
main.lx-home#main{max-width:none!important;width:100%!important;margin:0!important;padding:0!important;box-sizing:border-box}
@media (max-width:760px){.lx-home .lx-hotvid .vidbubble{width:78px;height:78px;bottom:12px}.lx-home .lx-specs dd{font-size:17px;white-space:nowrap}.lx-home .lx-specs>div{padding-inline:10px}}
@media (max-width:380px){.lx-burger span{display:none}.lx-burger{width:42px!important;padding:0!important;justify-content:center}}

/* ===== E3: name on top, round video in the middle, everything in the menu ===== */
.lx-nav-in{grid-template-columns:1fr auto 1fr!important;height:clamp(64px,8vh,88px)!important;max-width:1440px!important}
.lx-spacer{display:block}
.lx-brand .lx-bn b{font:500 clamp(20px,2.3vw,34px)/1.1 var(--lx-serif)!important;letter-spacing:.01em}
.lx-dsec{padding:18px 0;border-bottom:1px solid var(--line)}
.lx-chips{display:flex;flex-wrap:wrap;gap:8px}
.lx-socb[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.lx-socb{text-decoration:none}
.lx-strong{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important}
.lx-acc{margin-top:12px;display:flex;align-items:center;gap:10px;width:100%;min-height:44px;background:none;border:0;padding:0;font:400 15px var(--lx-sans);color:var(--ink);cursor:pointer;text-align:start}
.lx-acc svg{width:18px;height:18px}.lx-acc span:not(.lm-sw){flex:1}
.lx-acc[aria-checked="true"] .lm-sw{background:#15803D}.lx-acc[aria-checked="true"] .lm-sw::after{inset-inline-start:16px}
.lx-dadmin{border:1px dashed var(--gold);padding:14px;margin-top:14px;background:#fff}
.lx-dfoot{border-top:0!important}
.lx-dlinks{padding-top:6px!important}
.lx-dlink{padding:14px 2px!important;font-size:20px!important}
.lx-home{min-height:calc(100svh - clamp(64px,8vh,88px) - 1px)!important}
.lx-home-in{max-width:1000px!important;justify-content:center!important;text-align:center;gap:0;padding:clamp(16px,3vh,40px) 20px!important}
.lx-home .lx-kicker{margin-bottom:clamp(14px,2.6vh,30px)}
.lx-orb{--d:clamp(210px,min(46svh,78vw),620px);position:relative;width:var(--d);height:var(--d);flex:none}
.lx-orb::before{content:"";position:absolute;inset:calc(var(--d) * -.045);border-radius:50%;border:1px solid var(--gold);opacity:.6;pointer-events:none}
.lx-orb-face{position:absolute;inset:0;border-radius:50%;overflow:hidden;padding:0;border:0;cursor:pointer;background:#E9E3D8;box-shadow:0 40px 80px -40px rgba(28,27,25,.55)}
.lx-orb-face img,.lx-orb-face svg{width:100%;height:100%;object-fit:cover;display:block}
.lx-orb .lx-hotvid{position:absolute;inset:0;pointer-events:none}
.lx-orb .lx-hotvid .vidbubble{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;margin:0!important;pointer-events:auto}
.lx-orb .vbface{border:0!important;box-shadow:none!important}
.lx-orb .vbring{inset:calc(var(--d) * -.02)!important;border-color:rgba(176,141,76,.55)!important}
.lx-orb .vblabel{display:none!important}
.lx-orb .vbface{background:transparent!important}
.lx-orb .vidbubble:hover .vbface{transform:scale(1.015)}
.lx-orb-t{font:400 clamp(22px,2.4vw,34px)/1.2 var(--lx-serif);margin:clamp(18px,3.2vh,36px) 0 6px;color:var(--ink)}
.lx-orb-p{font:500 clamp(20px,2vw,28px) var(--lx-serif);color:var(--ink)}
.lx-orb-p *{font:inherit}
.lx-orb-s{margin-top:8px;font:400 15px var(--lx-sans);color:var(--muted);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.lx-orb-a{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:clamp(16px,2.8vh,30px)}
.lx-orb-adm{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-top:14px}

/* ===== hero tweaks: brand top-left, smaller orb, animated promo, compact buttons ===== */
.lx-nav-in{grid-template-columns:auto 1fr!important}
.lx-spacer{display:none!important}
.lx-brand{justify-self:end!important;text-align:end!important}
.lx-brand .lx-bn{align-items:flex-end!important}
.lx-brand .lx-bn b{font:500 clamp(30px,3.3vw,48px)/1.05 var(--lx-serif)!important;letter-spacing:0}
.lx-stage{display:flex;align-items:center;justify-content:center;gap:clamp(22px,4.5vw,72px);width:100%}
.lx-orb{--d:clamp(170px,min(36svh,34vw),420px)!important}
.lx-promo{display:flex;align-items:center;gap:clamp(12px,1.6vw,22px);background:none;border:0;padding:6px;cursor:pointer;color:var(--ink);text-align:start;font:inherit}
.lx-promo:focus-visible{outline:2px solid var(--gold);outline-offset:6px}
.lx-pstar{position:relative;flex:none;width:clamp(46px,4.6vw,68px);height:clamp(46px,4.6vw,68px);display:flex;align-items:center;justify-content:center;font-size:clamp(22px,2.2vw,32px);color:var(--gold);animation:lxStar 2.4s ease-in-out infinite}
.lx-pstar i{position:absolute;inset:0;border-radius:50%;border:1.5px dashed var(--gold);opacity:.75;animation:lxSpin 14s linear infinite}
.lx-pwords{display:flex;flex-direction:column;align-items:flex-start;gap:.06em}
.lx-pw{display:block;font:500 clamp(30px,4.4vw,64px)/1.08 var(--lx-serif);white-space:nowrap;
  background:linear-gradient(100deg,var(--ink) 0%,var(--ink) 38%,#C9A14E 48%,#F1D899 52%,#C9A14E 56%,var(--ink) 66%,var(--ink) 100%);background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:var(--ink);
  opacity:0;transform:translateY(14px);animation:lxRise .7s cubic-bezier(.2,.7,.2,1) forwards,lxShine 4.5s ease-in-out infinite;animation-delay:calc(var(--k) * .18s + .15s),calc(var(--k) * .25s + 1.4s)}
#app[dir="ltr"] .lx-pwords{align-items:flex-start}
#app[dir="ltr"] .lx-pw{font-size:clamp(26px,3.4vw,50px)}
.lx-promo:hover .lx-pw{text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:6px;text-decoration-thickness:1px}
@keyframes lxRise{to{opacity:1;transform:none}}
@keyframes lxShine{0%{background-position:100% 0}60%,100%{background-position:0 0}}
@keyframes lxStar{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes lxSpin{to{transform:rotate(360deg)}}
.lx-orb-a{gap:8px!important}

var A11YS={
he:{t:'הצהרת נגישות',p:['אנחנו רואים חשיבות רבה במתן שירות שוויוני לכל הלקוחות, ופועלים להנגיש את האתר לפי תקן ישראלי 5568 המבוסס על הנחיות WCAG 2.0 ברמה AA.','מה נעשה באתר: ניווט מלא במקלדת עם סימון פוקוס ברור, תוויות לקוראי מסך, ניגודיות צבעים מספקת, תמיכה בהגדלת טקסט, כיבוי אנימציות למי שהגדיר זאת במכשיר, ומצב "לכבדי ראייה" (בתפריט ← שפה) שמגדיל את האתר ומחזק ניגודיות. האתר זמין בעברית, אנגלית, רוסית וצרפתית.','מה עדיין לא מונגש במלואו: סרטוני הנכסים אינם כוללים כתוביות, ולחלק מהתמונות אין תיאור מפורט. את כל המידע על כל נכס אפשר לקבל בטלפון או בוואטסאפ.','נתקלתם בבעיה? נשמח לשמוע ולתקן:'],c:'רכזת נגישות',u:'עודכן לאחרונה: אוקטובר 2026'},
en:{t:'Accessibility statement',p:['We are committed to equal service for every client and work to make this site accessible according to Israeli Standard 5568, based on WCAG 2.0 level AA.','What we have done: full keyboard navigation with a clear focus outline, labels for screen readers, sufficient color contrast, support for text zoom, animations turned off for visitors who prefer reduced motion, and a "Low vision mode" (Menu → Language) that enlarges the site and strengthens contrast. The site is available in Hebrew, English, Russian and French.','Not yet fully accessible: property videos have no captions and some photos lack detailed descriptions. All details about any property are available by phone or WhatsApp.','Found a problem? We would be glad to hear and fix it:'],c:'Accessibility contact',u:'Last updated: October 2026'},
ru:{t:'Заявление о доступности',p:['Мы стремимся обслуживать всех клиентов на равных и делаем сайт доступным в соответствии с израильским стандартом 5568 (на основе WCAG 2.0, уровень AA).','Что сделано: полная навигация с клавиатуры с заметной рамкой фокуса, подписи для экранных чтецов, достаточная контрастность, поддержка увеличения текста, отключение анимации для тех, кто выбрал это в устройстве, и режим «Для слабовидящих» (Меню → Язык). Сайт доступен на иврите, английском, русском и французском.','Пока не полностью доступно: у видео объектов нет субтитров, у части фото нет подробного описания. Всю информацию об объекте можно получить по телефону или в WhatsApp.','Нашли проблему? Сообщите нам, и мы исправим:'],c:'Ответственный за доступность',u:'Обновлено: октябрь 2026'},
fr:{t:'Déclaration d’accessibilité',p:['Nous tenons à offrir un service égal à chaque client et rendons ce site accessible selon la norme israélienne 5568, fondée sur les WCAG 2.0 niveau AA.','Ce qui a été fait : navigation complète au clavier avec un focus visible, libellés pour lecteurs d’écran, contrastes suffisants, agrandissement du texte, animations désactivées pour les visiteurs qui le demandent, et un « Mode malvoyants » (Menu → Langue). Le site existe en hébreu, anglais, russe et français.','Pas encore entièrement accessible : les vidéos des biens n’ont pas de sous-titres et certaines photos n’ont pas de description détaillée. Toutes les informations sont disponibles par téléphone ou WhatsApp.','Un problème ? Dites-le-nous, nous le corrigerons :'],c:'Contact accessibilité',u:'Mise à jour : octobre 2026'}};

async function loadPubFiles(a){
  if(pubFiles.id===a.id)return;pubFiles={id:a.id,photos:[],video:[],loading:true};
  function get(u,i,kind){return fetch(u).then(function(r){return r.blob()}).then(function(b){var ty=b.type||(kind==='v'?'video/mp4':'image/jpeg');var ext=(ty.split('/')[1]||'jpg').replace('jpeg','jpg').replace('quicktime','mov');return new File([b],'nechess-'+a.id+'-'+(i+1)+'.'+ext,{type:ty})})}
  try{pubFiles.photos=await Promise.all((a.photos||[]).slice(0,35).map(function(u,i){return get(u,i,'p')}))}catch(e){pubFiles.photos=[]}
  try{pubFiles.video=await Promise.all((a.videos||[]).map(function(u,i){return get(u,i,'v')}))}catch(e){pubFiles.video=[]}

  if(act==='rv-save'||act==='rv-del'){
    if(act==='rv-del'&&!rvArmed){rvArmed=true;rvReadSheet();render();return}
    rvReadSheet();var d=rvd;
    if(act==='rv-save'&&(!String(d.name||'').trim()||!String(d.text||'').trim())){errMsg='צריך שם והמלצה.';render();return}
    var b=JSON.stringify(STATE);if(!STATE.reviews)STATE.reviews=[];
    if(act==='rv-del')STATE.reviews=STATE.reviews.filter(function(x){return x.id!==d.id});
    else{var rec={id:d.id,name:String(d.name).trim(),city:String(d.city||'').trim(),deal:d.deal||'',stars:+d.stars||5,text:String(d.text).trim(),src:d.src||'',url:String(d.url||'').trim(),shot:d.shot||''};var old=STATE.reviews.filter(function(x){return x.id===d.id})[0];rec.at=old?old.at:Date.now();if(old)STATE.reviews[STATE.reviews.indexOf(old)]=rec;else STATE.reviews.push(rec)}
    rvBusy='save';errMsg='';render();
    try{await publishState();rvd=null;rvBusy=false;rvArmed=false;render();toast(act==='rv-del'?'ההמלצה נמחקה':'נשמר ופורסם')}catch(e){STATE=JSON.parse(b);rvBusy=false;rvArmed=false;errMsg=failMsg(e);render()}
  }
}
